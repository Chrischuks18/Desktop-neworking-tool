name: Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Generate official Windows icon
        shell: pwsh
        run: |
          python -m pip install pillow --quiet
          @'
          from PIL import Image
          src = Image.open(r"src/OfficeNetwork.Client/Assets/ChoiceFlameLogo.png").convert("RGBA")
          side = max(src.size)
          canvas = Image.new("RGBA", (side, side), "white")
          canvas.paste(src, ((side-src.width)//2, (side-src.height)//2), src)
          canvas = canvas.resize((256,256), Image.Resampling.LANCZOS)
          canvas.save(r"src/OfficeNetwork.Client/Assets/ChoiceFlame.ico", format="ICO", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | python -

      - name: Restore
        run: dotnet restore OfficeNetworkManager.slnx
      - name: Build
        shell: pwsh
        run: |
          dotnet build OfficeNetworkManager.slnx -c Release --no-restore 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.workflow }}-${{ github.run_number }}
          path: build.log
      - name: Publish client
        run: dotnet publish src/OfficeNetwork.Client/OfficeNetwork.Client.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/client
      - name: Publish server
        run: dotnet publish src/OfficeNetwork.Server/OfficeNetwork.Server.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/server
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\ChoiceFlameNetwork.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: Choice-Flame-Communications-Network-Installer
          path: installer/output/Choice-Flame-Communications-Network-Setup.exe
