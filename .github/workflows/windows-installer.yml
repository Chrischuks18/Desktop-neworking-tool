name: Windows Installer

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: installer-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Cancel superseded installer checks on this branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_BRANCH: ${{ github.head_ref }}
          CURRENT_RUN: ${{ github.run_id }}
          CHECK_REPOSITORY: ${{ github.repository }}
        run: |
          $runs = gh api "repos/$env:CHECK_REPOSITORY/actions/workflows/windows-installer.yml/runs?event=pull_request&per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not list installer checks." }
          foreach ($run in $runs.workflow_runs) {
            if ($run.head_branch -eq $env:CHECK_BRANCH -and "$($run.id)" -ne $env:CURRENT_RUN -and $run.status -in @('queued','in_progress')) {
              gh api --method POST "repos/$env:CHECK_REPOSITORY/actions/runs/$($run.id)/cancel" 2>$null
              if ($LASTEXITCODE -ne 0) { Write-Host "Older check already completed or could not be cancelled." }
            }
          }
          exit 0
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Generate official Windows icon
        shell: pwsh
        run: |
          python -m pip install pillow --quiet
          @'
          from PIL import Image
          src = Image.open(r"src/OfficeNetwork.Client/Assets/ChoiceFlameLogo.png").convert("RGBA")
          side = max(src.size)
          canvas = Image.new("RGBA", (side, side), "white")
          canvas.paste(src, ((side-src.width)//2, (side-src.height)//2), src)
          canvas = canvas.resize((256,256), Image.Resampling.LANCZOS)
          canvas.save(r"src/OfficeNetwork.Client/Assets/ChoiceFlame.ico", format="ICO", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | python -

      - name: Restore
        run: dotnet restore OfficeNetworkManager.slnx
      - name: Build
        shell: pwsh
        run: |
          dotnet build OfficeNetworkManager.slnx -c Release --no-restore 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.workflow }}-${{ github.run_number }}
          path: build.log
      - name: Test backup restore and account security
        run: dotnet test tests/OfficeNetwork.Server.Tests/OfficeNetwork.Server.Tests.csproj -c Release --no-build --logger "trx;LogFileName=server-tests.trx"
      - name: Publish client
        run: dotnet publish src/OfficeNetwork.Client/OfficeNetwork.Client.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/client
      - name: Publish server
        run: dotnet publish src/OfficeNetwork.Server/OfficeNetwork.Server.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/server
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\ChoiceFlameNetwork.iss'
      - name: Test clean Windows server installation and restore
        timeout-minutes: 5
        shell: pwsh
        run: .github/scripts/Test-InstalledServer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Choice-Flame-Communications-Network-Installer
          path: installer/output/Choice-Flame-Communications-Network-Setup.exe
