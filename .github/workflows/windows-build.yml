name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Generate official Windows icon
        shell: pwsh
        run: |
          python -m pip install pillow --quiet
          @'
          from PIL import Image
          src = Image.open(r"src/OfficeNetwork.Client/Assets/ChoiceFlameLogo.png").convert("RGBA")
          side = max(src.size)
          canvas = Image.new("RGBA", (side, side), "white")
          canvas.paste(src, ((side-src.width)//2, (side-src.height)//2), src)
          canvas = canvas.resize((256,256), Image.Resampling.LANCZOS)
          canvas.save(r"src/OfficeNetwork.Client/Assets/ChoiceFlame.ico", format="ICO", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | python -

      - name: Restore
        run: dotnet restore OfficeNetworkManager.slnx
      - name: Build
        shell: pwsh
        run: |
          dotnet build OfficeNetworkManager.slnx -c Release --no-restore 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.workflow }}-${{ github.run_number }}
          path: build.log
      - name: Test backup restore and account security
        run: dotnet test tests/OfficeNetwork.Server.Tests/OfficeNetwork.Server.Tests.csproj -c Release --no-build --logger "trx;LogFileName=server-tests.trx"
      - name: Check all desktop sections at smaller window sizes
        timeout-minutes: 5
        run: dotnet run --project tests/OfficeNetwork.Client.LayoutChecks/OfficeNetwork.Client.LayoutChecks.csproj -c Release --no-build -- artifacts/layout-checks
      - name: Upload desktop layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-layout-checks
          path: artifacts/layout-checks/
      - name: Publish Client
        run: dotnet publish src/OfficeNetwork.Client/OfficeNetwork.Client.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/client
      - name: Publish Server
        run: dotnet publish src/OfficeNetwork.Server/OfficeNetwork.Server.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/server
      - name: Include backup restore guide
        run: Copy-Item docs/BACKUP-RESTORE.md artifacts/server/BACKUP-RESTORE.md
      - uses: actions/upload-artifact@v4
        with:
          name: Choice-Flame-Communications-Network-Windows
          path: artifacts/
